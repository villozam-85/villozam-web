<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Prueba de Banderas</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        margin: 0;
        background-color: #f5f5f5;
      }

      .flag-container {
        display: flex;
        flex-direction: column;
        gap: 20px;
        background-color: white;
        padding: 30px;
        border-radius: 10px;
        box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
      }

      .flag-item {
        display: flex;
        align-items: center;
        gap: 10px;
      }

      img {
        border: 1px solid #ddd;
      }
    </style>
  </head>
  <body>
    <div class="flag-container">
      <h2>Selector de Idioma</h2>

      <div class="flag-item">
        <img src="img/flags/es.svg" width="30" height="20" alt="Español" />
        <span>Español</span>
      </div>

      <div class="flag-item">
        <img src="img/flags/en.svg" width="30" height="20" alt="English" />
        <span>English</span>
      </div>

      <div
        style="margin-top: 30px; padding-top: 20px; border-top: 1px solid #eee"
      >
        <h3>Visualización en Dropdown</h3>
        <div style="position: relative; display: inline-block">
          <div
            style="
              display: flex;
              align-items: center;
              background: #f8f9fa;
              padding: 8px 15px;
              border-radius: 4px;
              cursor: pointer;
            "
          >
            <img
              src="img/flags/es.svg"
              width="18"
              height="12"
              alt="Español"
              style="margin-right: 5px"
            />
            <span>ES</span>
            <i style="margin-left: 5px">▼</i>
          </div>
          <div
            style="
              position: absolute;
              top: 100%;
              left: 0;
              background: white;
              min-width: 120px;
              box-shadow: 0 2px 5px rgba(0, 0, 0, 0.2);
              border-radius: 4px;
              margin-top: 5px;
            "
          >
            <div
              style="
                padding: 8px 15px;
                display: flex;
                align-items: center;
                background: #f0f0f0;
              "
            >
              <img
                src="img/flags/es.svg"
                width="18"
                height="12"
                alt="Español"
                style="margin-right: 5px"
              />
              <span>Español</span>
            </div>
            <div style="padding: 8px 15px; display: flex; align-items: center">
              <img
                src="img/flags/en.svg"
                width="18"
                height="12"
                alt="English"
                style="margin-right: 5px"
              />
              <span>English</span>
            </div>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
